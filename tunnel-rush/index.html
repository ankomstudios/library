<html>
  <head>
<style id="af-fullscreen">
html,body{margin:0!important;padding:0!important;width:100vw!important;height:100vh!important;overflow:hidden!important}
canvas{display:block!important;width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important}

    <base href="https://cdn.jsdelivr.net/gh/wnasmile/LAMAR@main/tunnel-rush/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Tunnel Rush</title>
    <link rel="stylesheet" href="style/style.css">
    <script src="UnityLoader.js"></script>
    <script src="UnityProgress.js"></script>
    <link rel="icon" href="img/tunnel.jpg">

      var gameInstance = UnityLoader.instantiate("gameContainer", "build.json", {onProgress: UnityProgress,Module:{onRuntimeInitialized: function() {UnityProgress(gameInstance, "complete")}}});

	            <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
	            <div class="title">Tunnel Rush</div>
	        </div>
    </div>
  </body>
</html>
