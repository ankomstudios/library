<!DOCTYPE html>
<html lang="en-us">
<base href="https://cdn.jsdelivr.net/gh/waycrosspublicmedia/whatver/groongroon/">
  <head>
<style id="af-fullscreen">
html,body{margin:0!important;padding:0!important;width:100vw!important;height:100vh!important;overflow:hidden!important}
canvas{display:block!important;width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important}
#unity-container,.unity-desktop,#c2canvasdiv,#gameContainer,#game-container{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important}
</style>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>gg kart</title>
    <script src="Build/UnityLoader.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #unityContainer {
        width: 100%;
        height: 100%;
      }
    
</style>
  </head>
  <body>
    <div id="unityContainer"></div>

    <script>
      // Instantiate Unity with full window size
      var unityInstance = UnityLoader.instantiate("unityContainer", "Build/web build.json", {
        width: window.innerWidth,
        height: window.innerHeight
      });

      // Optional: make Unity resize dynamically if the window changes
      window.addEventListener("resize", function() {
        var container = document.getElementById("unityContainer");
        container.style.width = window.innerWidth + "px";
        container.style.height = window.innerHeight + "px";
        if (unityInstance && unityInstance.SetFullscreen) {
          unityInstance.SetFullscreen(true);
        }
      });
    </script>
  
</body>
</html>
