<body>

	<noscript>failed to run js, check network or ignore even running tbis lmao.</noscript>

	<div id="openfl-content"></div>

	<script>
		// Fetch Funkin.js as text and inject via blob: URL to bypass raw GitHub's text/plain MIME type
		fetch("https://raw.githubusercontent.com/syndicatelibrary/dufrayightdunkin/main/Funkin.js")
			.then(res => {
				if (!res.ok) throw new Error("Failed to fetch Funkin.js: " + res.status);
				return res.text();
			})
			.then(text => {
				const blob = new Blob([text], { type: "application/javascript" });
				const blobUrl = URL.createObjectURL(blob);
				const script = document.createElement("script");
				script.src = blobUrl;
				script.onload = () => {
					URL.revokeObjectURL(blobUrl);
					window.addEventListener("touchmove", function(event) { event.preventDefault(); }, { capture: false, passive: false });
					if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
						var meta = document.getElementById("viewport");
						meta.setAttribute('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
					}
					lime.embed("Funkin", "openfl-content", 1280, 720, { parameters: {} });
				};
				script.onerror = () => {
					URL.revokeObjectURL(blobUrl);
					document.body.innerHTML = "<p style='color:red;font-family:monospace;padding:20px'>❌ Failed to execute Funkin.js</p>";
				};
				document.body.appendChild(script);
			})
			.catch(err => {
				document.body.innerHTML = "<p style='color:red;font-family:monospace;padding:20px'>❌ " + err.message + "</p>";
			});
	</script>
